<style>
/* Layout: карта сайта в нотации Гарретта — дерево сверху вниз, ортогональные шины, группы пунктиром, связи между ветками — ссылками в блоках */
:root{
  color-scheme:light;
  --bg:#f7f8fa; --paper:#ffffff; --ink:#1b2230; --muted:#6b7385; --line:#cfd5df; --wire:#8b95a8;
  --accent:#2453c9; --accent-soft:#e8eefc; --open:#c2372d; --area:#eef1f6; --soft:#eef0f4;
  --f:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.35;display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-inline:16px;padding-block:10px;background:var(--paper);border-bottom:1px solid var(--line)}
h1{font-size:15px;font-weight:700;margin:0}
.key{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:12px;flex:1 1 300px;min-width:0}
.key b{color:var(--ink);font-weight:600}
.key .r{color:var(--open)}
.zoom{display:flex;gap:4px}
.zoom button{font:500 12px var(--f);height:26px;min-width:28px;padding:0 8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:4px;cursor:pointer}
.vp{flex:1;min-height:420px;overflow:auto;cursor:grab;background:var(--bg)}
.vp.drag{cursor:grabbing}
.stage{position:relative;transform-origin:0 0}
svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
svg .w{fill:none;stroke:var(--wire);stroke-width:1.2}
svg .w.hi{stroke:var(--accent);stroke-width:2}
.area{position:absolute;border:1px dashed var(--wire);border-radius:10px;background:var(--area)}
.area span{position:absolute;top:-10px;left:14px;background:var(--bg);padding:0 6px;color:var(--muted);font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.card{position:absolute;width:290px;background:var(--paper);border:1px solid var(--line);border-radius:5px}
.card.root{border:1.5px solid var(--ink)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.card.flash{animation:fl 1.3s ease}
@keyframes fl{0%,60%{box-shadow:0 0 0 6px var(--accent-soft);border-color:var(--accent)}}
.hd{padding:10px 12px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.t{font-weight:700;font-size:16px;display:flex;gap:5px;align-items:baseline}
.t .m{font-weight:500;color:var(--muted);font-size:13px}
.s{color:var(--muted);font-size:12.5px;margin-top:2px}
.hd.q .t::after{content:"●";color:var(--open);font-size:9px;margin-left:auto}
.nt{color:var(--open);font-size:12.5px;margin-top:4px}
ul{list-style:none;margin:0;padding:4px 0 6px}
li{padding:6px 12px;position:relative;border-top:1px solid var(--soft)}
li:first-child{border-top:0}
.no{display:inline-block;min-width:18px;color:var(--muted);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
li .d{color:var(--muted);font-size:12.5px;margin:2px 0 0 18px}
li .xs{margin-left:18px}
li .n{padding-right:14px;font-weight:600}
li .xs{display:flex;flex-wrap:wrap;gap:0 8px}
li.q .n::after{content:" ●";color:var(--open);font-size:10px}
li .dn{position:absolute;right:10px;top:6px;color:var(--wire);font-weight:700}
li.k .n{font-weight:600}
.lk{display:inline;color:var(--accent);cursor:pointer;background:none;border:0;padding:0;font:500 12.5px var(--f);white-space:nowrap}
.lk:hover{text-decoration:underline}
.ex{color:var(--muted);font-size:12.5px;white-space:nowrap}
.ims{margin:4px 0 0 18px;display:flex;flex-direction:column;gap:2px}
a.im{color:var(--accent);font-size:12.5px;text-decoration:none;display:inline-block}
a.im::before{content:"▣ ";color:var(--wire)}
a.im:hover{text-decoration:underline}
.hd a.im{display:block;margin-top:4px}
.wn{margin:3px 0 0 18px;color:var(--open);font-size:12px}
.gh{background:var(--paper);border-top:1px solid var(--line);padding-inline:16px;padding-block:8px}
.gh summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:12px}
.gl{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px}
.gl div{font-size:12px} .gl b{text-decoration:line-through;text-decoration-color:var(--wire)} .gl span{color:var(--muted)}
button:focus-visible,.hd:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.card.flash{animation:none}}
</style>

const CW=290, GX=28, GY=56, AP=22; /* card width, gaps, area padding */

const subBottom=id=>Math.max(pos[id].y+H[id],...(kids[id]||[]).map(subBottom));
{const fb=Math.max(...FOOTER.map(subBottom))+AP+50; LOOSE.forEach((id,i)=>{pos[id]={x:looseX+AP+i*(CW+GX),y:fb}; C[id].style.left=pos[id].x+"px"; C[id].style.top=fb+"px"; maxY=Math.max(maxY,fb+H[id])}); areas.push(["Нет входа из меню",looseX,looseX+lw+AP*2,LOOSE,fb]);}

  wires.push({p,ids:[par,...ch]});
}
